<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="header">
      <h1>Weekly Forcast App</h1>
      <button id="forcast-button" class="glass">Forcast</button>
    </section>
    <section class="output-section">
      <div class="glass" id="div1">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div2">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div3">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div4">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div5">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div6">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
      <div class="glass" id="div7">
        <p class="date"></p>
        <div class="temps">
          <div class="low"></div>
          <div class="actual"></div>
          <div class="high"></div>
        </div>
      </div>
    </section>
    <dialog id="centerpoint">
      <dialog id="dialog">
        <form action="">
          <p class="form-child">
            <label for="location">Submit a location: </label>
            <input type="text" id="location" />
          </p>
          <button id="submit-forcast">Forcast Location</button>
        </form>
      </dialog>
    </dialog>
    <script src="main.js"></script>
  </body>
</html>
